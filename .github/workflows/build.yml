name: Build Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the installer as a GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build native helper
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Smoke-test native helper
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/test-native.ps1

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: OneShell-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      # Publish the installer on the repo's Releases page so it's a plain download link.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OneShell ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/OneShell-Setup-*.exe
          body: |
            **Download `OneShell-Setup-${{ steps.version.outputs.version }}.exe` below and run it** (Windows 10 and 11, 64-bit).

            Windows SmartScreen may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.

            To get the normal Windows taskbar back at any time: right-click the OneShell tray icon → **Quit OneShell**, or press **Ctrl + Alt + Shift + Q**.
