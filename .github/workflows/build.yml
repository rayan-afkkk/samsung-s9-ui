name: Build Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build native helper
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Smoke-test native helper
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/test-native.ps1

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: OneShell-Setup
          path: dist/*.exe
          if-no-files-found: error
